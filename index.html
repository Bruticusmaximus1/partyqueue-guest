<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#6750a4"
    >

    <title>Join PartyQueue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                linear-gradient(
                    135deg,
                    #1d1633,
                    #392d61
                );
            color: #ffffff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 34px 28px;
            border-radius: 24px;
            background: #ffffff;
            color: #221b2e;
            text-align: center;
            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.35);
        }

        .music-icon {
            margin-bottom: 12px;
            font-size: 64px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .subtitle {
            margin: 12px 0 28px;
            color: #625b71;
            font-size: 17px;
            line-height: 1.5;
        }

        .party-label {
            margin-bottom: 8px;
            color: #625b71;
            font-size: 15px;
        }

        .party-code {
            margin-bottom: 28px;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 5px;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            margin-bottom: 8px;
            text-align: left;
            font-weight: bold;
        }

        input {
            width: 100%;
            min-height: 54px;
            padding: 12px 16px;
            border: 2px solid #cac4d0;
            border-radius: 12px;
            font-size: 18px;
        }

        input:focus {
            border-color: #6750a4;
            outline: none;
        }

        button {
            width: 100%;
            min-height: 56px;
            margin-top: 18px;
            border: 0;
            border-radius: 28px;
            background: #6750a4;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #57418d;
        }

        button:disabled {
            background: #aaa3b3;
            cursor: not-allowed;
        }

        .message {
            min-height: 24px;
            margin: 20px 0 0;
            font-weight: bold;
            line-height: 1.4;
        }

        .message.error {
            color: #ba1a1a;
        }

        .message.success {
            color: #386a20;
        }

        .success-panel {
            padding: 20px;
            border-radius: 16px;
            background: #e9f7df;
            color: #234b12;
        }

        .success-panel h2 {
            margin: 0 0 12px;
        }

        .success-panel p {
            margin: 8px 0;
            line-height: 1.5;
        }

        .note {
            margin: 22px 0 0;
            color: #79747e;
            font-size: 13px;
            line-height: 1.4;
        }

        [hidden] {
            display: none;
        }
    </style>
</head>

<body>
    <main class="card">
        <div
            class="music-icon"
            aria-hidden="true"
        >
            🎵
        </div>

        <h1>PARTYQUEUE</h1>

        <p class="subtitle">
            You have been invited to help choose the music.
        </p>

        <div class="party-label">
            Party code
        </div>

        <div
            id="partyCode"
            class="party-code"
        >
            Loading...
        </div>

        <form id="joinForm">
            <label for="guestName">
                Your name
            </label>

            <input
                id="guestName"
                name="guestName"
                type="text"
                maxlength="30"
                autocomplete="name"
                placeholder="Enter your name"
                required
            >

            <button
                id="continueButton"
                type="submit"
            >
                JOIN PARTY
            </button>
        </form>

        <section
            id="successPanel"
            class="success-panel"
            hidden
        >
            <h2>You're in! 🎉</h2>

            <p id="successMessage"></p>

            <p>
                Song searching and requests will be added next.
            </p>
        </section>

        <p
            id="message"
            class="message"
            aria-live="polite"
        ></p>

        <p class="note">
            PartyQueue remembers your guest session on this
            device so you can return to the party.
        </p>
    </main>

    <script type="module">
        import {
            createClient
        } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/+esm";

        /*
         * Replace these two placeholders with the Project URL
         * and publishable key saved in Notepad.
         */
        const SUPABASE_URL =
            "https://nszqzyrhlyjkvzfrbeih.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_AGN1WppiECaM4_WvbOxdLg_-QXEM4o-";

        const supabaseClient = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        const parameters =
            new URLSearchParams(window.location.search);

        const partyCode =
            (parameters.get("code") || "")
                .trim()
                .toUpperCase();

        const validPartyCodePattern =
            /^[A-HJ-NP-Z2-9]{6}$/;

        const partyCodeElement =
            document.getElementById("partyCode");

        const joinForm =
            document.getElementById("joinForm");

        const guestNameInput =
            document.getElementById("guestName");

        const continueButton =
            document.getElementById("continueButton");

        const messageElement =
            document.getElementById("message");

        const successPanel =
            document.getElementById("successPanel");

        const successMessage =
            document.getElementById("successMessage");

        const configurationIsReady =
            !SUPABASE_URL.includes("PASTE_YOUR") &&
            !SUPABASE_PUBLISHABLE_KEY.includes(
                "PASTE_YOUR"
            );

        function showError(message) {
            messageElement.textContent = message;
            messageElement.className =
                "message error";
        }

        function clearMessage() {
            messageElement.textContent = "";
            messageElement.className =
                "message";
        }

        function getFriendlyError(error) {
            const technicalMessage =
                error?.message || "";

            if (
                technicalMessage.includes(
                    "Party not found"
                )
            ) {
                return (
                    "This party could not be found, " +
                    "or it is no longer active."
                );
            }

            if (
                technicalMessage.includes(
                    "Anonymous sign-ins are disabled"
                )
            ) {
                return (
                    "Guest sign-in is not currently enabled."
                );
            }

            if (
                technicalMessage.includes(
                    "Failed to fetch"
                )
            ) {
                return (
                    "Could not reach PartyQueue. " +
                    "Check your internet connection and try again."
                );
            }

            return technicalMessage
                ? `Could not join the party: ${technicalMessage}`
                : "Could not join the party. Please try again.";
        }

        async function ensureAnonymousSession() {
            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();

            if (error) {
                throw error;
            }

            if (!data.session) {
                const {
                    error: signInError
                } =
                    await supabaseClient.auth
                        .signInAnonymously();

                if (signInError) {
                    throw signInError;
                }
            }
        }

        if (validPartyCodePattern.test(partyCode)) {
            partyCodeElement.textContent = partyCode;
        } else {
            partyCodeElement.textContent = "NO CODE";
            continueButton.disabled = true;

            showError(
                "Please scan a valid PartyQueue QR code."
            );
        }

        if (!configurationIsReady) {
            continueButton.disabled = true;

            showError(
                "The PartyQueue website has not been " +
                "connected to Supabase yet."
            );
        }

        const savedName =
            localStorage.getItem(
                "partyQueueGuestName"
            );

        if (savedName) {
            guestNameInput.value = savedName;
        }

        joinForm.addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const guestName =
                    guestNameInput.value.trim();

                if (!guestName) {
                    showError(
                        "Please enter your name."
                    );

                    guestNameInput.focus();
                    return;
                }

                if (guestName.length > 30) {
                    showError(
                        "Your name must be 30 characters or fewer."
                    );

                    guestNameInput.focus();
                    return;
                }

                if (
                    !validPartyCodePattern.test(
                        partyCode
                    )
                ) {
                    showError(
                        "Please scan a valid PartyQueue QR code."
                    );

                    return;
                }

                clearMessage();

                continueButton.disabled = true;
                guestNameInput.disabled = true;
                continueButton.textContent =
                    "JOINING...";

                let joinedSuccessfully = false;

                try {
                    await ensureAnonymousSession();

                    const {
                        error
                    } =
                        await supabaseClient.rpc(
                            "join_party",
                            {
                                p_code: partyCode,
                                p_display_name: guestName
                            }
                        );

                    if (error) {
                        throw error;
                    }

                    localStorage.setItem(
                        "partyQueueGuestName",
                        guestName
                    );

                    successMessage.textContent =
                        `${guestName}, you joined party ` +
                        `${partyCode}.`;

                    joinForm.hidden = true;
                    successPanel.hidden = false;
                    joinedSuccessfully = true;

                } catch (error) {
                    console.error(
                        "PartyQueue join error:",
                        error
                    );

                    showError(
                        getFriendlyError(error)
                    );

                } finally {
                    if (!joinedSuccessfully) {
                        continueButton.disabled = false;
                        guestNameInput.disabled = false;
                        continueButton.textContent =
                            "JOIN PARTY";
                    }
                }
            }
        );
    </script>
</body>
</html>
