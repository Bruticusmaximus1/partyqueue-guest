<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#6750a4"
    >

    <title>PartyQueue Spotify Search Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            background:
                linear-gradient(
                    135deg,
                    #1d1633,
                    #392d61
                );
            color: #ffffff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .page {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            padding: 28px;
            border-radius: 24px;
            background: #ffffff;
            color: #221b2e;
            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            margin: 12px 0 26px;
            color: #625b71;
            text-align: center;
            line-height: 1.5;
        }

        .party-code {
            margin-bottom: 24px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            min-height: 54px;
            padding: 12px 16px;
            border: 2px solid #cac4d0;
            border-radius: 12px;
            font-size: 17px;
        }

        input:focus {
            border-color: #6750a4;
            outline: none;
        }

        button {
            min-height: 54px;
            padding: 0 22px;
            border: 0;
            border-radius: 27px;
            background: #6750a4;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #57418d;
        }

        button:disabled {
            background: #aaa3b3;
            cursor: not-allowed;
        }

        .message {
            min-height: 24px;
            margin: 20px 0;
            font-weight: bold;
            line-height: 1.5;
            text-align: center;
        }

        .message.error {
            color: #ba1a1a;
        }

        .message.success {
            color: #386a20;
        }

        .results {
            display: grid;
            gap: 14px;
        }

        .track {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 14px;
            border: 1px solid #ded8e2;
            border-radius: 16px;
            background: #faf8fc;
        }

        .track-image {
            width: 72px;
            height: 72px;
            flex: 0 0 72px;
            border-radius: 10px;
            background: #e8e2eb;
            object-fit: cover;
        }

        .image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .track-details {
            min-width: 0;
            flex: 1;
        }

        .track-name {
            margin: 0 0 5px;
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .artist-name {
            margin: 0 0 4px;
            color: #4c4557;
            overflow-wrap: anywhere;
        }

        .album-name {
            margin: 0;
            color: #79747e;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .track-meta {
            margin-top: 7px;
            color: #79747e;
            font-size: 13px;
        }

        .explicit {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 5px;
            border-radius: 4px;
            background: #4c4557;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
        }

        @media (max-width: 550px) {
            body {
                padding: 14px;
            }

            .card {
                padding: 24px 18px;
            }

            .search-row {
                display: block;
            }

            input,
            button {
                width: 100%;
            }

            button {
                margin-top: 10px;
            }

            .track-image {
                width: 60px;
                height: 60px;
                flex-basis: 60px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card">
            <h1>🎵 PARTYQUEUE</h1>

            <p class="subtitle">
                Spotify search function test
            </p>

            <div
                id="partyCode"
                class="party-code"
            >
                Loading...
            </div>

            <form id="searchForm">
                <label for="searchInput">
                    Search for a song or artist
                </label>

                <div class="search-row">
                    <input
                        id="searchInput"
                        type="search"
                        minlength="2"
                        maxlength="100"
                        placeholder="Example: Daft Punk"
                        autocomplete="off"
                        required
                    >

                    <button
                        id="searchButton"
                        type="submit"
                    >
                        SEARCH
                    </button>
                </div>
            </form>

            <p
                id="message"
                class="message"
                aria-live="polite"
            ></p>

            <section
                id="results"
                class="results"
                aria-live="polite"
            ></section>
        </section>
    </main>

    <script type="module">
        import {
            createClient
        } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/+esm";

        /*
         * Replace these placeholders with the same values
         * already used in the main index.html page.
         */
        const SUPABASE_URL =
            "https://nszqzyrhlyjkvzfrbeih.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_AGN1WppiECaM4_WvbOxdLg_-QXEM4o-";

        const supabaseClient =
            createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                }
            );

        const parameters =
            new URLSearchParams(
                window.location.search
            );

        const partyCode =
            (
                parameters.get("code") ||
                ""
            )
                .trim()
                .toUpperCase();

        const validPartyCodePattern =
            /^[A-HJ-NP-Z2-9]{6}$/;

        const partyCodeElement =
            document.getElementById(
                "partyCode"
            );

        const searchForm =
            document.getElementById(
                "searchForm"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const searchButton =
            document.getElementById(
                "searchButton"
            );

        const messageElement =
            document.getElementById(
                "message"
            );

        const resultsElement =
            document.getElementById(
                "results"
            );

        function showMessage(
            message,
            type = ""
        ) {
            messageElement.textContent =
                message;

            messageElement.className =
                type
                    ? `message ${type}`
                    : "message";
        }

        function clearResults() {
            resultsElement.replaceChildren();
        }

        function formatDuration(
            durationMilliseconds
        ) {
            if (
                typeof durationMilliseconds !==
                    "number" ||
                !Number.isFinite(
                    durationMilliseconds
                )
            ) {
                return "";
            }

            const totalSeconds =
                Math.floor(
                    durationMilliseconds / 1000
                );

            const minutes =
                Math.floor(
                    totalSeconds / 60
                );

            const seconds =
                totalSeconds % 60;

            return (
                `${minutes}:` +
                seconds
                    .toString()
                    .padStart(2, "0")
            );
        }

        function createTrackImage(
            track
        ) {
            if (track.imageUrl) {
                const image =
                    document.createElement(
                        "img"
                    );

                image.className =
                    "track-image";

                image.src =
                    track.imageUrl;

                image.alt =
                    `Album artwork for ${track.trackName}`;

                image.loading =
                    "lazy";

                return image;
            }

            const placeholder =
                document.createElement(
                    "div"
                );

            placeholder.className =
                "track-image image-placeholder";

            placeholder.textContent =
                "🎵";

            placeholder.setAttribute(
                "aria-hidden",
                "true"
            );

            return placeholder;
        }

        function createTrackElement(
            track
        ) {
            const trackElement =
                document.createElement(
                    "article"
                );

            trackElement.className =
                "track";

            trackElement.appendChild(
                createTrackImage(track)
            );

            const detailsElement =
                document.createElement(
                    "div"
                );

            detailsElement.className =
                "track-details";

            const trackNameElement =
                document.createElement(
                    "p"
                );

            trackNameElement.className =
                "track-name";

            trackNameElement.textContent =
                track.trackName;

            if (track.explicit === true) {
                const explicitElement =
                    document.createElement(
                        "span"
                    );

                explicitElement.className =
                    "explicit";

                explicitElement.textContent =
                    "E";

                explicitElement.title =
                    "Explicit";

                trackNameElement.appendChild(
                    explicitElement
                );
            }

            const artistElement =
                document.createElement(
                    "p"
                );

            artistElement.className =
                "artist-name";

            artistElement.textContent =
                track.artistName;

            const albumElement =
                document.createElement(
                    "p"
                );

            albumElement.className =
                "album-name";

            albumElement.textContent =
                track.albumName ||
                "Album unavailable";

            const duration =
                formatDuration(
                    track.durationMs
                );

            const metadataElement =
                document.createElement(
                    "div"
                );

            metadataElement.className =
                "track-meta";

            metadataElement.textContent =
                duration
                    ? `Duration: ${duration}`
                    : `Spotify track ID: ${track.spotifyTrackId}`;

            detailsElement.append(
                trackNameElement,
                artistElement,
                albumElement,
                metadataElement
            );

            trackElement.appendChild(
                detailsElement
            );

            return trackElement;
        }

        function displayTracks(
            tracks
        ) {
            clearResults();

            if (
                !Array.isArray(tracks) ||
                tracks.length === 0
            ) {
                showMessage(
                    "No matching Spotify tracks were found."
                );

                return;
            }

            const fragment =
                document.createDocumentFragment();

            tracks.forEach(
                function (track) {
                    fragment.appendChild(
                        createTrackElement(
                            track
                        )
                    );
                }
            );

            resultsElement.appendChild(
                fragment
            );

            showMessage(
                `Found ${tracks.length} Spotify tracks.`,
                "success"
            );
        }

        async function readFunctionError(
            error
        ) {
            /*
             * Supabase HTTP function errors may contain the
             * JSON response returned by our Edge Function.
             */
            if (
                error?.context &&
                typeof error.context.json ===
                    "function"
            ) {
                try {
                    const errorBody =
                        await error.context.json();

                    if (
                        typeof errorBody?.error ===
                            "string"
                    ) {
                        return errorBody.error;
                    }

                    if (
                        typeof errorBody?.message ===
                            "string"
                    ) {
                        return errorBody.message;
                    }
                } catch {
                    /*
                     * Fall back to the normal error message.
                     */
                }
            }

            return (
                error?.message ||
                "PartyQueue could not search Spotify."
            );
        }

        async function confirmGuestSession() {
            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .getSession();

            if (error) {
                throw error;
            }

            if (!data.session) {
                throw new Error(
                    "Open the normal PartyQueue guest page " +
                    "and join this party first."
                );
            }
        }

        const configurationIsReady =
            !SUPABASE_URL.includes(
                "PASTE_YOUR"
            ) &&
            !SUPABASE_PUBLISHABLE_KEY.includes(
                "PASTE_YOUR"
            );

        if (
            validPartyCodePattern.test(
                partyCode
            )
        ) {
            partyCodeElement.textContent =
                partyCode;
        } else {
            partyCodeElement.textContent =
                "NO CODE";

            searchButton.disabled =
                true;

            showMessage(
                "A valid PartyQueue code is required.",
                "error"
            );
        }

        if (!configurationIsReady) {
            searchButton.disabled =
                true;

            showMessage(
                "This test page has not been connected " +
                "to Supabase.",
                "error"
            );
        }

        searchForm.addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const query =
                    searchInput.value.trim();

                if (query.length < 2) {
                    showMessage(
                        "Enter at least two characters.",
                        "error"
                    );

                    searchInput.focus();
                    return;
                }

                clearResults();

                searchButton.disabled =
                    true;

                searchInput.disabled =
                    true;

                searchButton.textContent =
                    "SEARCHING...";

                showMessage(
                    "Searching Spotify..."
                );

                try {
                    await confirmGuestSession();

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .functions
                            .invoke(
                                "spotify-search",
                                {
                                    body: {
                                        query,
                                        partyCode
                                    }
                                }
                            );

                    if (error) {
                        throw new Error(
                            await readFunctionError(
                                error
                            )
                        );
                    }

                    displayTracks(
                        data?.tracks
                    );

                } catch (error) {
                    console.error(
                        "Spotify search test error:",
                        error
                    );

                    showMessage(
                        error?.message ||
                            "PartyQueue could not search Spotify.",
                        "error"
                    );

                } finally {
                    searchButton.disabled =
                        false;

                    searchInput.disabled =
                        false;

                    searchButton.textContent =
                        "SEARCH";
                }
            }
        );
    </script>
</body>
</html>
